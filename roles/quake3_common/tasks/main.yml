---
# ENGINE AND GAME DATA. Applied to the server and to every client -- both need the same
# .pk3 files, and sv_pure 1 means "the same" is literal.

# ---------------------------------------------------------------------------------------
# WHICH PACKAGES, AND WHY NOT THE OBVIOUS ONES.
#
#   ioquake3         universe. The client engine. ioquake3 1.36, DFSG-free, no game data.
#   ioquake3-server  universe. ioq3ded plus the qagame server modules.
#
# We deliberately do NOT install `quake3` or `quake3-server`. Those live in MULTIVERSE,
# are only launcher wrappers built from game-data-packager, and enabling multiverse on
# someone's workstation is a system-wide apt change this repo has no business making.
# Everything the wrappers do -- pass fs_basepath, pick a homepath -- we do explicitly, in
# the systemd unit and the launcher script, where it is readable.
#
# Neither package is on $PATH. The binaries are /usr/lib/ioquake3/{ioquake3,ioq3ded}.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- install the engine
  ansible.builtin.apt:
    name:
      - ioquake3
      - ioquake3-server
      # Needed to unpack baseq3.zip on the target.
      - unzip
    state: present
    # Ensure-presence only. No version pin, no apt source added, no dist-upgrade -- the
    # rule this workstation's other two Ansible trees already follow.
    update_cache: true
    cache_valid_time: 3600
  become: true

# ---------------------------------------------------------------------------------------
# WHAT IS ALREADY INSTALLED, ASKED FIRST.
#
# This runs BEFORE the search below, and the search and its assert are skipped when every
# machine in the play already has pak0.pk3 in place. Without that ordering, a re-run on a
# fully provisioned fleet aborts with "no game data found on the control node" the moment
# the ORIGINAL copy is no longer where it was -- moved, deleted, an external drive
# unplugged, or just a different $HOME because someone ran the playbook under sudo. There
# is nothing to install in that case, and failing is the wrong answer to a question that
# did not need asking.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- has the game data already been unpacked
  ansible.builtin.stat:
    path: "{{ lanparty_quake3_basepath }}/baseq3/pak0.pk3"
  register: lanparty_pak0
  changed_when: false

- name: Quake3 -- does any machine in this play still need the data
  ansible.builtin.set_fact:
    # ansible_play_hosts, not groups[...]: with --limit the play may be a subset, and a
    # host that is not being touched must not keep the copy running for one that is.
    lanparty_data_needed: >-
      {{ ansible_play_hosts
         | map('extract', hostvars, ['lanparty_pak0', 'stat', 'exists'])
         | select('equalto', false) | list | length > 0 }}
  run_once: true

- name: Quake3 -- note that no machine needs the data pushed
  ansible.builtin.debug:
    msg: >-
      pak0.pk3 is already in {{ lanparty_quake3_basepath }}/baseq3 on every machine in this
      play. Skipping the control-node search -- the original copy does not need to still be
      lying around for a re-run to work.
  run_once: true
  when: not lanparty_data_needed

# ---------------------------------------------------------------------------------------
# FINDING THE GAME DATA, WITHOUT ANYONE HAVING TO SAY WHERE IT IS.
#
# pak0.pk3 is retail id Software data. It is not redistributable, so it is not in this
# repo and cannot be -- that is why Debian ships game-data-packager, a tool that builds a
# package from YOUR copy, rather than shipping the copy.
#
# What we can do is stop making a human type a path. This searches the places the data
# actually lives on a machine that owns the game, in order, and uses the first hit. Only
# the CONTROL NODE needs it: Ansible pushes what it finds to every other machine, so one
# copy in the room is enough.
#
# Set lanparty_quake3_baseq3_src to skip the search entirely.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- find the game data
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/find-game-data.sh"
      - "{{ playbook_dir }}"
  register: lanparty_data_search
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  when:
    - lanparty_data_needed
    - lanparty_quake3_baseq3_src | length == 0

# ---------------------------------------------------------------------------------------
# NOTHING LOCAL? FETCH IT FROM THE RCLONE REMOTE.
#
# This is what makes a brand-new control node a clone-and-run affair rather than "first,
# find the disc". It lands in .gamedata/baseq3.zip, which is BOTH the first path the search
# above looks at and gitignored -- so the download happens once, every later run finds it
# locally, and the retail data still never goes near git.
#
# See lanparty_quake3_baseq3_rclone_src in group_vars/all.yml for why rclone rather than
# get_url, and why this role does not install it.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- decide whether the remote copy is needed
  ansible.builtin.set_fact:
    lanparty_data_fetch: >-
      {{ lanparty_data_needed
         and lanparty_quake3_baseq3_src | length == 0
         and lanparty_quake3_baseq3_rclone_src | length > 0
         and (lanparty_data_search.stdout | default('') | trim) | length == 0 }}
  run_once: true

- name: Quake3 -- is rclone installed on the control node
  ansible.builtin.command:
    argv: [rclone, version]
  register: lanparty_rclone
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  when: lanparty_data_fetch

- name: Quake3 -- explain how to set rclone up, rather than installing it
  ansible.builtin.assert:
    that: lanparty_rclone.rc == 0
    fail_msg: |-
      No game data on this machine, and rclone is not installed to fetch it.

      rclone is not installed by this repo on purpose -- it is a Homebrew package here and
      Homebrew belongs to another Ansible tree. Any of these gets you moving:

        brew install rclone            then: rclone config     (add a Google Drive remote)
        sudo apt install rclone        same

      The remote this expects is {{ lanparty_quake3_baseq3_rclone_src }}, set in
      group_vars/all.yml as lanparty_quake3_baseq3_rclone_src. Change it to match your own
      remote name, or set it to "" and drop a copy in one of the local paths instead.
    quiet: true
  run_once: true
  when: lanparty_data_fetch

- name: Quake3 -- create the .gamedata directory on the control node
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.gamedata"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  when: lanparty_data_fetch

- name: Quake3 -- fetch the archive from the rclone remote
  ansible.builtin.command:
    # copyto, not copy: `copy` treats the destination as a directory and would land the
    # file at .gamedata/baseq3.zip/baseq3.zip. --checksum makes a re-run compare hashes
    # rather than sizes, so a half-finished earlier transfer is replaced instead of kept.
    argv:
      - rclone
      - copyto
      - --checksum
      - "{{ lanparty_quake3_baseq3_rclone_src }}"
      - "{{ playbook_dir }}/.gamedata/baseq3.zip"
  delegate_to: localhost
  run_once: true
  # 637 MB over a domestic uplink. The default 30 s SSH timeout does not apply to a local
  # command, but a slow link still needs saying out loud: this task is the long one.
  when: lanparty_data_fetch

- name: Quake3 -- look again, now that the archive is local
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/find-game-data.sh"
      - "{{ playbook_dir }}"
  # ITS OWN REGISTER NAME, NOT lanparty_data_search. A SKIPPED task still registers a
  # result, and that result has no stdout_lines -- so reusing the name would overwrite the
  # successful first search with a skip result on every run that did NOT need to download
  # anything, which is every run once the archive is local. The symptom was "No Quake III
  # game data found" with the file sitting right there.
  register: lanparty_data_refind
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  when: lanparty_data_fetch

- name: Quake3 -- settle on where the game data is coming from
  ansible.builtin.set_fact:
    # WHICH SEARCH RESULT TO BELIEVE. The re-search after an rclone download has its own
    # register name (see the task above for why), so pick it only when it actually ran and
    # produced output; otherwise the original search stands. Resolved once, here, so the
    # two facts below cannot disagree about which result they read.
    lanparty_data_lines: >-
      {{ (lanparty_data_refind.stdout_lines | default([]))
         if (lanparty_data_refind.stdout_lines | default([])) | length >= 2
         else (lanparty_data_search.stdout_lines | default([])) }}
  run_once: true

- name: Quake3 -- settle on where the game data is coming from
  ansible.builtin.set_fact:
    # The script prints kind on the first line and the path on the second, and Ansible
    # splits stdout into stdout_lines for free -- so there is no separator to lose in
    # translation. It used to print <kind>\t<path> and split on '\t' here, which SILENTLY
    # produced an empty path: this is a folded scalar, where '\t' reaches Jinja as a literal
    # backslash-t rather than a tab. The symptom was "No Quake III game data found" on a
    # machine with the archive sitting in ~/Downloads.
    #
    # Both facts require TWO lines before they trust either, so a half-written result
    # reports "found nothing" rather than a kind with no path.
    #
    # "zip" means unarchive it; "dir" means copy the pk3 files out of it.
    lanparty_data_kind: >-
      {{ 'zip' if lanparty_quake3_baseq3_src | length > 0
         else (lanparty_data_lines[0] if lanparty_data_lines | length >= 2 else '') }}
    lanparty_data_path: >-
      {{ lanparty_quake3_baseq3_src if lanparty_quake3_baseq3_src | length > 0
         else (lanparty_data_lines[1] if lanparty_data_lines | length >= 2 else '') }}
  run_once: true

- name: Quake3 -- say what was found, or explain what is missing
  ansible.builtin.assert:
    that: lanparty_data_path | length > 0
    success_msg: "Game data: {{ lanparty_data_path }} ({{ lanparty_data_kind }})"
    fail_msg: |-
      No Quake III game data found on the control node.

      pak0.pk3 is retail data that this repo cannot ship. Put a copy anywhere below and
      re-run -- nothing needs configuring, the search finds it:

        ~/Downloads/baseq3.zip                  a zip containing baseq3/*.pk3
        {{ playbook_dir }}/.gamedata/baseq3.zip   same, kept with the repo (gitignored)
        {{ playbook_dir }}/.gamedata/baseq3/      or the loose .pk3 files

      Already own it? These are searched too, and need no copying at all:

        ~/.steam/steam/steamapps/common/Quake 3 Arena/baseq3   (Steam, appid 2200)
        ~/.local/share/Steam/steamapps/common/Quake 3 Arena/baseq3
        ~/GOG Games/Quake III Arena/baseq3
        a mounted retail CD under /media/{{ lookup('env', 'USER') }}/

      Only the control node needs it. Ansible pushes it to every other machine.

      Sure it is in one of those? Check that you did not run the playbook itself under
      sudo -- that resets $HOME to /root and hides ~/Downloads. bootstrap.sh does not need
      it; the individual tasks that do use become.
    quiet: true
  run_once: true
  when: lanparty_data_needed

- name: Quake3 -- verify the checksum, when one is pinned
  ansible.builtin.stat:
    path: "{{ lanparty_data_path }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: lanparty_data_stat
  delegate_to: localhost
  run_once: true
  changed_when: false
  when:
    - lanparty_quake3_baseq3_sha256 | length > 0
    - lanparty_data_kind == 'zip'

- name: Quake3 -- fail on a checksum mismatch
  ansible.builtin.assert:
    that: lanparty_data_stat.stat.checksum == lanparty_quake3_baseq3_sha256
    fail_msg: >-
      {{ lanparty_data_path }} does not match lanparty_quake3_baseq3_sha256. Either the
      file differs from the one this was pinned against -- which is fine, several legal
      copies exist -- or it is truncated. Update the variable, or set it to "" to accept
      whatever is found.
    quiet: true
  run_once: true
  when:
    - lanparty_quake3_baseq3_sha256 | length > 0
    - lanparty_data_kind == 'zip'

- name: Quake3 -- create the game data directory
  ansible.builtin.file:
    # /usr/lib/quake3/base is not an arbitrary choice: the Debian package pre-creates it
    # with the cgame/ui/qagame .so modules already symlinked in, and both AppArmor
    # profiles allow reads under /usr/lib/quake3/. Dropping the paks alongside those
    # modules makes one coherent fs_basepath.
    path: "{{ lanparty_quake3_basepath }}/baseq3"
    state: directory
    mode: "0755"
  become: true

- name: Quake3 -- unpack the game data from an archive
  ansible.builtin.unarchive:
    src: "{{ lanparty_data_path }}"
    dest: "{{ lanparty_quake3_basepath }}"
    # The archive was made on macOS, so it carries a __MACOSX/ tree of AppleDouble
    # resource forks. They are not pk3 files; leaving them out keeps the sv_pure
    # checksum list to real data and saves copying a few hundred junk entries.
    #
    # It also ships its own q3config.cfg. That must not land either: the client config is
    # built by roles/quake3_client from a known base, and a stray one in the basepath
    # would be a second, invisible source of cvars.
    #
    # Everything goes through `exclude` -- it already becomes unzip's -x. Passing a second
    # -x through extra_opts would put it after the archive name, where unzip reads it as a
    # file to extract rather than to skip.
    exclude:
      - "__MACOSX"
      - "__MACOSX/*"
      - "baseq3/q3config.cfg"
    owner: root
    group: root
    # CAPITAL X, NOT 0644. unarchive applies `mode` to everything it extracts, including
    # the baseq3 DIRECTORY -- and a directory at 0644 has no execute bit, so nobody but
    # root can traverse into it and every read of a pak fails with EACCES. `X` sets the
    # execute bit only on directories (and on files that already had it), which is what
    # 0644 was reaching for.
    mode: "u=rwX,g=rX,o=rX"
  become: true
  when:
    - not lanparty_pak0.stat.exists
    - lanparty_data_kind == 'zip'

# The other shape: the data is already unpacked somewhere -- a Steam or GOG install, or a
# mounted disc. Copy the pk3 files out rather than making anyone zip them up first.
- name: Quake3 -- list the pk3 files in an existing install
  ansible.builtin.find:
    paths: "{{ lanparty_data_path }}"
    patterns: "*.pk3"
  register: lanparty_found_paks
  delegate_to: localhost
  run_once: true
  changed_when: false
  when: lanparty_data_kind == 'dir'

- name: Quake3 -- copy the game data from an existing install
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ lanparty_quake3_basepath }}/baseq3/{{ item.path | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lanparty_found_paks.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true
  when:
    - not lanparty_pak0.stat.exists
    - lanparty_data_kind == 'dir'

- name: Quake3 -- confirm the retail data is present
  ansible.builtin.stat:
    path: "{{ lanparty_quake3_basepath }}/baseq3/pak0.pk3"
  register: lanparty_pak0_final
  changed_when: false

- name: Quake3 -- report the installed data
  ansible.builtin.assert:
    that: lanparty_pak0_final.stat.exists
    fail_msg: >-
      pak0.pk3 is still absent from {{ lanparty_quake3_basepath }}/baseq3 after unpacking.
      The archive probably does not have a top-level baseq3/ directory.
    quiet: true
