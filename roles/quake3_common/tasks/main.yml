---
# ENGINE AND GAME DATA. Applied to the server and to every client -- both need the same
# .pk3 files, and sv_pure 1 means "the same" is literal.

# ---------------------------------------------------------------------------------------
# WHICH PACKAGES, AND WHY NOT THE OBVIOUS ONES.
#
#   ioquake3         universe. The client engine. ioquake3 1.36, DFSG-free, no game data.
#   ioquake3-server  universe. ioq3ded plus the qagame server modules.
#
# We deliberately do NOT install `quake3` or `quake3-server`. Those live in MULTIVERSE,
# are only launcher wrappers built from game-data-packager, and enabling multiverse on
# someone's workstation is a system-wide apt change this repo has no business making.
# Everything the wrappers do -- pass fs_basepath, pick a homepath -- we do explicitly, in
# the systemd unit and the launcher script, where it is readable.
#
# Neither package is on $PATH. The binaries are /usr/lib/ioquake3/{ioquake3,ioq3ded}.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- install the engine
  ansible.builtin.apt:
    name:
      - ioquake3
      - ioquake3-server
      # Needed to unpack baseq3.zip on the target.
      - unzip
    state: present
    # Ensure-presence only. No version pin, no apt source added, no dist-upgrade -- the
    # rule this workstation's other two Ansible trees already follow.
    update_cache: true
    cache_valid_time: 3600
  become: true

# ---------------------------------------------------------------------------------------
# FINDING THE GAME DATA, WITHOUT ANYONE HAVING TO SAY WHERE IT IS.
#
# pak0.pk3 is retail id Software data. It is not redistributable, so it is not in this
# repo and cannot be -- that is why Debian ships game-data-packager, a tool that builds a
# package from YOUR copy, rather than shipping the copy.
#
# What we can do is stop making a human type a path. This searches the places the data
# actually lives on a machine that owns the game, in order, and uses the first hit. Only
# the CONTROL NODE needs it: Ansible pushes what it finds to every other machine, so one
# copy in the room is enough.
#
# Set lanparty_quake3_baseq3_src to skip the search entirely.
# ---------------------------------------------------------------------------------------
- name: Quake3 -- find the game data
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/find-game-data.sh"
      - "{{ playbook_dir }}"
  register: lanparty_data_search
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  when: lanparty_quake3_baseq3_src | length == 0

- name: Quake3 -- settle on where the game data is coming from
  ansible.builtin.set_fact:
    # "zip" means unarchive it; "dir" means copy the pk3 files out of it.
    lanparty_data_kind: >-
      {{ 'zip' if lanparty_quake3_baseq3_src | length > 0
         else ((lanparty_data_search.stdout | default('') | trim).split('\t')[0]
               if (lanparty_data_search.stdout | default('') | trim) | length > 0 else '') }}
    lanparty_data_path: >-
      {{ lanparty_quake3_baseq3_src if lanparty_quake3_baseq3_src | length > 0
         else ((lanparty_data_search.stdout | default('') | trim).split('\t')[1]
               if '\t' in (lanparty_data_search.stdout | default('') | trim) else '') }}
  run_once: true

- name: Quake3 -- say what was found, or explain what is missing
  ansible.builtin.assert:
    that: lanparty_data_path | length > 0
    success_msg: "Game data: {{ lanparty_data_path }} ({{ lanparty_data_kind }})"
    fail_msg: |-
      No Quake III game data found on the control node.

      pak0.pk3 is retail data that this repo cannot ship. Put a copy anywhere below and
      re-run -- nothing needs configuring, the search finds it:

        ~/Downloads/baseq3.zip                  a zip containing baseq3/*.pk3
        {{ playbook_dir }}/.gamedata/baseq3.zip   same, kept with the repo (gitignored)
        {{ playbook_dir }}/.gamedata/baseq3/      or the loose .pk3 files

      Already own it? These are searched too, and need no copying at all:

        ~/.steam/steam/steamapps/common/Quake 3 Arena/baseq3   (Steam, appid 2200)
        ~/.local/share/Steam/steamapps/common/Quake 3 Arena/baseq3
        ~/GOG Games/Quake III Arena/baseq3
        a mounted retail CD under /media/{{ lookup('env', 'USER') }}/

      Only the control node needs it. Ansible pushes it to every other machine.
    quiet: true
  run_once: true

- name: Quake3 -- verify the checksum, when one is pinned
  ansible.builtin.stat:
    path: "{{ lanparty_data_path }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: lanparty_data_stat
  delegate_to: localhost
  run_once: true
  changed_when: false
  when:
    - lanparty_quake3_baseq3_sha256 | length > 0
    - lanparty_data_kind == 'zip'

- name: Quake3 -- fail on a checksum mismatch
  ansible.builtin.assert:
    that: lanparty_data_stat.stat.checksum == lanparty_quake3_baseq3_sha256
    fail_msg: >-
      {{ lanparty_data_path }} does not match lanparty_quake3_baseq3_sha256. Either the
      file differs from the one this was pinned against -- which is fine, several legal
      copies exist -- or it is truncated. Update the variable, or set it to "" to accept
      whatever is found.
    quiet: true
  run_once: true
  when:
    - lanparty_quake3_baseq3_sha256 | length > 0
    - lanparty_data_kind == 'zip'

- name: Quake3 -- create the game data directory
  ansible.builtin.file:
    # /usr/lib/quake3/base is not an arbitrary choice: the Debian package pre-creates it
    # with the cgame/ui/qagame .so modules already symlinked in, and both AppArmor
    # profiles allow reads under /usr/lib/quake3/. Dropping the paks alongside those
    # modules makes one coherent fs_basepath.
    path: "{{ lanparty_quake3_basepath }}/baseq3"
    state: directory
    mode: "0755"
  become: true

- name: Quake3 -- has the game data already been unpacked
  ansible.builtin.stat:
    path: "{{ lanparty_quake3_basepath }}/baseq3/pak0.pk3"
  register: lanparty_pak0

- name: Quake3 -- unpack the game data from an archive
  ansible.builtin.unarchive:
    src: "{{ lanparty_data_path }}"
    dest: "{{ lanparty_quake3_basepath }}"
    # The archive was made on macOS, so it carries a __MACOSX/ tree of AppleDouble
    # resource forks. They are not pk3 files; leaving them out keeps the sv_pure
    # checksum list to real data and saves copying a few hundred junk entries.
    #
    # It also ships its own q3config.cfg. That must not land either: the client config is
    # built by roles/quake3_client from a known base, and a stray one in the basepath
    # would be a second, invisible source of cvars.
    #
    # Everything goes through `exclude` -- it already becomes unzip's -x. Passing a second
    # -x through extra_opts would put it after the archive name, where unzip reads it as a
    # file to extract rather than to skip.
    exclude:
      - "__MACOSX"
      - "__MACOSX/*"
      - "baseq3/q3config.cfg"
    owner: root
    group: root
    # CAPITAL X, NOT 0644. unarchive applies `mode` to everything it extracts, including
    # the baseq3 DIRECTORY -- and a directory at 0644 has no execute bit, so nobody but
    # root can traverse into it and every read of a pak fails with EACCES. `X` sets the
    # execute bit only on directories (and on files that already had it), which is what
    # 0644 was reaching for.
    mode: "u=rwX,g=rX,o=rX"
  become: true
  when:
    - not lanparty_pak0.stat.exists
    - lanparty_data_kind == 'zip'

# The other shape: the data is already unpacked somewhere -- a Steam or GOG install, or a
# mounted disc. Copy the pk3 files out rather than making anyone zip them up first.
- name: Quake3 -- list the pk3 files in an existing install
  ansible.builtin.find:
    paths: "{{ lanparty_data_path }}"
    patterns: "*.pk3"
  register: lanparty_found_paks
  delegate_to: localhost
  run_once: true
  changed_when: false
  when: lanparty_data_kind == 'dir'

- name: Quake3 -- copy the game data from an existing install
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ lanparty_quake3_basepath }}/baseq3/{{ item.path | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lanparty_found_paks.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true
  when:
    - not lanparty_pak0.stat.exists
    - lanparty_data_kind == 'dir'

- name: Quake3 -- confirm the retail data is present
  ansible.builtin.stat:
    path: "{{ lanparty_quake3_basepath }}/baseq3/pak0.pk3"
  register: lanparty_pak0_final
  changed_when: false

- name: Quake3 -- report the installed data
  ansible.builtin.assert:
    that: lanparty_pak0_final.stat.exists
    fail_msg: >-
      pak0.pk3 is still absent from {{ lanparty_quake3_basepath }}/baseq3 after unpacking.
      The archive probably does not have a top-level baseq3/ directory.
    quiet: true
