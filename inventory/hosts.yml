---
# THE LAN PARTY ROSTER. This is the file you edit before an event.
#
# ONE ADDRESS PER MACHINE. `lan_ip` is the machine's address on the physical LAN, and it
# is used for BOTH jobs:
#
#   deployment   Ansible reaches the machine over it by SSH to install things.
#   gameplay     the dedicated server binds it; clients connect to it.
#
# There is deliberately no second, overlay address. An earlier version of this repo
# deployed over a Tailscale tailnet and played over the LAN, which meant two addresses per
# host that must never be swapped -- one wrong paste and the whole party silently played
# through a WireGuard tunnel. One address cannot be swapped with anything.
#
# What you give up: you can no longer provision a machine that is not on this LAN. That is
# the correct trade for a party where every machine is in the room anyway.
#
# `lan_ip` is optional. Omit it and Ansible connects to the inventory hostname instead
# (see `ansible_host` below), which works if that name resolves -- mDNS/`.local`, your
# router's DHCP-fed DNS, or an /etc/hosts entry. The game address then falls back to the
# host's default IPv4 address, which is right for any machine with one NIC (Network
# Interface Card). Set `lan_ip` explicitly on anything multi-homed.
#
# `ansible-playbook --tags preflight` reports whether the LAN path is really being used
# before you install anything. Run it once everyone is plugged in.
all:
  vars:
    # Override per host if a machine has a different login.
    ansible_user: chris

    # THE LINE THAT MAKES ONE ADDRESS ENOUGH. Ansible templates this per host, so the
    # address you SSH to is by construction the address the game uses -- they cannot drift
    # apart, because there is only one of them. Hosts with no lan_ip fall back to their
    # inventory name and are resolved by DNS.
    ansible_host: "{{ lan_ip | default(inventory_hostname) }}"

  children:
    # EXACTLY ONE HOST. The dedicated server. Its lan_ip is what every client connects to.
    game_server:
      hosts:
        chris-framework:
          ansible_connection: local

    # Every machine someone plays on. The server machine may also appear here -- one
    # person hosting and playing on the same box is the normal small-party setup.
    game_clients:
      hosts:
        chris-framework:
          ansible_connection: local

        # --- Add party machines below. Uncomment and fill in. -------------------------
        # Get the address from `ip -4 -br addr` on that machine, or leave lan_ip out and
        # let DNS resolve the hostname. Everyone must be on ONE flat layer-2 segment.
        #
        # someones-laptop:
        #   lan_ip: 192.168.1.41
        #
        # someone-elses-laptop:
        #   lan_ip: 192.168.1.42
        #
        # a-laptop-whose-name-resolves:      # no lan_ip: connect by name, detect the address
