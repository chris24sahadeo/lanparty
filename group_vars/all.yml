---
# Every variable this repo understands. One file, all prefixed `lanparty_`, so a grep for
# the prefix finds every knob.

# ---------------------------------------------------------------------------------------
# WHICH GAME
# ---------------------------------------------------------------------------------------
# Selects games/<id>.yml. Adding a game means adding that manifest plus the roles it
# names -- nothing in site.yml changes. See README, "Adding a game".
lanparty_game: quake3

# ---------------------------------------------------------------------------------------
# THE LAN PATH -- the reason this repo exists
# ---------------------------------------------------------------------------------------
# The address the game binds and connects on, and the same address Ansible deployed over:
# inventory/hosts.yml templates `ansible_host` from `lan_ip`, so there is exactly one
# address per machine and no way to use the wrong one.
#
# Defaults to the host's primary IPv4 address, which is correct for a machine with one NIC
# (Network Interface Card). Override per host with `lan_ip:` in inventory/hosts.yml for
# anything multi-homed.
#
# It must be an address the machine actually holds on the party segment, and never an
# address handed out by an overlay network such as Tailscale's 100.64.0.0/10 -- this repo
# no longer uses one, but a machine may still be running the daemon for unrelated reasons.
# roles/lan_preflight checks both.
lanparty_lan_ip: "{{ lan_ip | default(ansible_facts['default_ipv4']['address']) }}"

# Preflight is WARN-ONLY by default: it prints findings and continues, so a first run on a
# half-assembled network still provisions everything. Flip to true on party morning and a
# machine whose game traffic would leave over the wrong interface, or whose ping is over
# budget, fails the run instead.
lanparty_preflight_strict: false

# Worst acceptable round trip to the server, milliseconds. A wired 1GbE switch gives well
# under 1 ms; contended WiFi gives 5-50 ms with spikes an order of magnitude worse. 5 is a
# threshold that passes any wired setup and flags most wireless ones.
lanparty_max_rtt_ms: 5

# ---------------------------------------------------------------------------------------
# QUAKE III ARENA -- game data
# ---------------------------------------------------------------------------------------
# LEAVE THIS EMPTY. Empty means "go and find it", and roles/quake3_common searches the
# places the data actually lives -- ~/Downloads/baseq3.zip, the repo's own .gamedata/, a
# Steam or GOG install, a mounted disc -- and uses the first hit. Nobody should have to
# type a path to make this work.
#
# Retail id Software data is not redistributable, so it is never committed; .gitignore
# blocks *.pk3, baseq3.zip and .gamedata/. Only the CONTROL NODE needs a copy, because
# Ansible pushes whatever it finds to every other machine.
#
# Set it to an absolute path only to override the search.
lanparty_quake3_baseq3_src: ""

# THE FALLBACK, when the control node has no copy at all: an rclone remote holding
# baseq3.zip. Only consulted after the local search above comes up empty, so a machine that
# already has the data never touches the network.
#
# WHY RCLONE AND NOT A PLAIN URL. The archive lives in Google Drive, and Drive does not
# serve a 637 MB file over plain HTTP: anything past roughly 100 MB gets an HTML virus-scan
# interstitial instead of the bytes. `get_url` would happily write that HTML to
# .gamedata/baseq3.zip and the failure would surface much later as an unzip error that says
# nothing about what went wrong. rclone handles the interstitial, resumes a broken transfer,
# and verifies the copy against Drive's own MD5 (Message Digest 5) checksum -- which is why
# no separate checksum is pinned on this path.
#
# WHAT THIS REPO WILL NOT DO IS INSTALL RCLONE. It is a Homebrew package on this
# workstation and Homebrew belongs to layer 2; see "One owner per thing" in CLAUDE.md. A
# control node without it gets told how to set it up and the run stops there.
#
# The remote name is per-machine (it lives in ~/.config/rclone/rclone.conf, which this repo
# also does not manage). Set to "" to disable the fallback entirely.
lanparty_quake3_baseq3_rclone_src: "personal-gdrive:lanparty/baseq3.zip"

# sha256 of the archive, when you want one enforced. Empty by default because with the
# search enabled the file could legitimately be any of several valid copies, and a
# checksum that rejects a perfectly good one is worse than no checksum. Pin it if your
# party is standardising on one archive:
#   bd543781e517ff1eff6ae2a4a602c6e0f450bcfc3d3424d9e12f86266f82b302
lanparty_quake3_baseq3_sha256: ""

# Where the .pk3 files land. /usr/lib/quake3/base/baseq3 is not arbitrary: Debian's
# ioquake3 package pre-creates that exact directory for game data, and BOTH AppArmor
# profiles (/etc/apparmor.d/usr.lib.ioquake3.{ioquake3,ioq3ded}) allow reads under
# /usr/lib/quake3/. Putting the data anywhere else means fighting a confinement profile.
lanparty_quake3_basepath: /usr/lib/quake3/base

# ---------------------------------------------------------------------------------------
# QUAKE III ARENA -- dedicated server
# ---------------------------------------------------------------------------------------
lanparty_quake3_hostname: "Office LAN Party"
lanparty_quake3_port: 27960
lanparty_quake3_maxclients: 16
# 0 free-for-all, 1 tournament, 3 team deathmatch, 4 capture the flag.
lanparty_quake3_gametype: 0
lanparty_quake3_fraglimit: 30
lanparty_quake3_timelimit: 15
# Server tick rate. The client's `snaps` should match it -- see lanparty_quake3_lan_cvars.
# 40 is the LAN standard; the stock default of 20 exists for 1999 internet links.
lanparty_quake3_sv_fps: 40
# sv_pure 1 makes the server reject clients whose .pk3 set does not match. Safe here
# because Ansible pushes byte-identical data everywhere; it is also what stops one person
# with a modified pak from having different hitboxes.
lanparty_quake3_sv_pure: 1
# ---------------------------------------------------------------------------------------
# MOVEMENT PHYSICS. THE ONE SETTING THAT DECIDES WHETHER THE GAME IS FAIR.
# ---------------------------------------------------------------------------------------
# Quake III integrates player movement in whole milliseconds, once per rendered frame, so
# JUMP HEIGHT AND STRAFE ACCELERATION DEPEND ON YOUR FRAME RATE. That is not a bug being
# worked around, it is how idTech3 works, and it is why com_maxfps 125 became the community
# standard: 1000/125 is exactly 8 ms, so the rounding lands the same way every frame.
#
# The problem at a LAN party is that com_maxfps 125 is a REQUEST. A machine that dips to 90
# in a firefight gets different jumps from the machine next to it that holds 125, and the
# person who cannot make a jump they have made a thousand times has no way to tell that the
# reason was frame rate.
#
# pmove_fixed 1 removes the coupling entirely: the server steps movement at a fixed
# pmove_msec interval regardless of what any client's frame rate is doing. pmove_msec 8 is
# 125 Hz, so the physics are IDENTICAL to a machine perfectly holding com_maxfps 125 -- the
# muscle memory everyone already has -- except now everyone gets it, including whoever
# brought the oldest laptop.
#
# WHAT IT COSTS: input is quantised to the 8 ms step, so up to 8 ms of the delay between
# your mouse moving and the server acting on it. Some VQ3 purists dislike it for exactly
# that reason. On mismatched party hardware, everyone having the same physics is worth more
# than 8 ms. Set to 0 for stock frame-rate-coupled movement.
#
# The game module clamps pmove_msec to [8, 33]; 8 is the floor and the only value that
# matches 125 fps physics. It is a game-module cvar (qagame), which is why it lives in
# server.cfg rather than on the engine command line.
lanparty_quake3_pmove_fixed: 1
lanparty_quake3_pmove_msec: 8

lanparty_quake3_maps:
  - q3dm6
  - q3dm7
  - q3dm17
  - q3tourney2
# Remote console password. Override on the command line for a real party:
#   ./bootstrap.sh -e lanparty_quake3_rcon_password=something
# Never commit a real one -- this repo is public.
lanparty_quake3_rcon_password: "changeme"

# Short command name symlinked to the launcher, so `q` starts the game and joins the
# server. Set to "" to skip it.
#
# A SYMLINK IN /usr/local/bin, NOT A SHELL ALIAS. An alias means writing into ~/.zshrc,
# and on this workstation shell config belongs to chezmoi -- an Ansible role editing it
# is the rule this machine already follows being broken. The symlink also works in
# non-interactive shells, over ssh, from the .desktop entry, and in any shell at all,
# which an alias does not.
lanparty_quake3_alias: q

# System account the dedicated server runs as. Not a login user.
lanparty_quake3_server_user: quake3-server
# fs_homepath for the server. AppArmor allows the server rwk under
# /var/games/quake3-server/, which is why it is here and not under /opt.
lanparty_quake3_server_home: /var/games/quake3-server

# ---------------------------------------------------------------------------------------
# QUAKE III ARENA -- graphics
# ---------------------------------------------------------------------------------------
# 1080p ON EVERY MACHINE. Not the panel's native mode, deliberately.
#
# This used to be empty, meaning "detect it", and the client role read the first connected
# display's preferred mode out of /sys/class/drm. Two things were wrong with that at a
# party. It picks whichever output the kernel enumerates first, which on a laptop docked to
# an external monitor is the monitor -- one machine here was configured for 3840x2160, and
# rendering a 1999 title at 4K spends frame time on pixels nobody is scoring frags with.
# And it gives every machine a different resolution, so what you learn on one does not
# transfer to the next.
#
# 1920x1080 is the competitive standard, it is identical everywhere, and it leaves the
# largest headroom for holding com_maxfps 125 rock steady -- which is what actually matters
# below, because Quake III's movement physics are coupled to frame rate.
#
# WHAT IT COSTS. On a fixed-pixel panel that is not 1920x1080, the display scales every
# frame, which is softer than native; on a 3:2 laptop panel a 16:9 mode is also letterboxed.
# That is a real trade and it is made on purpose: predictable and fast beats sharp.
#
# Detection still runs, but only to CLAMP DOWN -- a 1366x768 panel cannot show 1080p at all,
# so it gets its own mode instead of a black screen. Set both to "" to go back to
# per-machine native detection.
lanparty_quake3_width: "1920"
lanparty_quake3_height: "1080"

# Which renderer. ioquake3 ships two and defaults to opengl2.
#
# WE PICK opengl1, DELIBERATELY. opengl2 adds per-pixel lighting, HDR and bloom, and it
# compiles shaders on first map load -- a visible hitch, at the exact moment everyone
# spawns. opengl1 is the renderer this game's art was authored against, has flat frame
# times, and on any GPU made this decade neither one is the bottleneck. Predictable beats
# pretty at a LAN party. Set to "opengl2" if you would rather have the effects.
lanparty_quake3_renderer: opengl1

# Quality settings. Hardware-agnostic: Quake III is a 1999 title and every one of these is
# free on a modern integrated GPU, so they are turned up rather than tuned per machine.
# The ones that would cost input latency are called out individually.
lanparty_quake3_gfx_cvars:
  - seta r_allowExtensions "1"
  # 4x multisample anti-aliasing. At native laptop resolution this is not measurable on
  # anything current, and Quake III's hard geometric edges are exactly what MSAA fixes.
  - seta r_ext_multisample "4"
  # Anisotropic filtering: keeps floor and wall textures sharp at grazing angles, which is
  # most of what you look at while strafing down a corridor.
  - seta r_ext_texture_filter_anisotropic "1"
  - seta r_ext_max_anisotropy "16"
  # Trilinear. The engine default is GL_LINEAR_MIPMAP_NEAREST, which shows a visible seam
  # where mipmap levels change. Note the capital M -- the cvar is r_textureMode.
  - seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
  # 0 = full texture resolution. Higher numbers were how you made 1999 hardware cope.
  - seta r_picmip "0"
  - seta r_texturebits "32"
  - seta r_colorbits "32"
  - seta r_depthbits "24"
  # Stencil buffer, required for real shadows rather than the blob.
  - seta r_stencilbits "8"
  # Curve tessellation. Default 4 makes arches and pipes visibly faceted; 1 is the finest.
  - seta r_subdivisions "1"
  # Level of detail. Together these stop models and curves visibly snapping between
  # detail levels as you move -- distracting, and the movement it draws the eye to is
  # sometimes an opponent.
  - seta r_lodbias "0"
  - seta r_lodCurveError "10000"
  - seta r_detailtextures "1"
  - seta r_marksOnTriangleMeshes "1"
  # r_fastsky 1 paints the sky flat to save fill rate. Nothing here needs that saving.
  - seta r_fastsky "0"
  - seta r_dynamiclight "1"
  - seta r_flares "1"
  - seta cg_shadows "1"
  # VSYNC OFF. Costs tearing, saves up to a whole frame of input latency, and this panel
  # is 60 Hz while the game runs at 125.
  - seta r_swapInterval "0"
  # LEAVE AT 0. r_finish 1 forces the CPU to block until the GPU has finished every frame.
  # It is sometimes suggested as a smoothness fix and it is a direct input-latency tax.
  - seta r_finish "0"
  # 125, not 120 and not uncapped. Quake III's movement physics are framerate-coupled --
  # jump height and strafe acceleration change with com_maxfps, and 125 is the value the
  # whole game's muscle memory was built on.
  - seta com_maxfps "125"

# ---------------------------------------------------------------------------------------
# QUAKE III ARENA -- client
# ---------------------------------------------------------------------------------------
# Appended after the shipped config so these win. The base config came from a single
# player's machine and carries `snaps 20` / `cl_maxpackets 30`, which are internet-era
# values -- on a LAN they throw away information the network can easily carry. Set to []
# to ship the base config untouched.
lanparty_quake3_lan_cvars:
  # Bytes per second the client will accept. 25000 is the engine's practical ceiling.
  - seta rate "25000"
  # Snapshots per second requested from the server. Must not exceed the server's sv_fps,
  # or the client asks for frames that do not exist.
  - seta snaps "{{ lanparty_quake3_sv_fps }}"
  # Client-to-server packets per second. The engine hard-clamps this to [15, 125]; 30 is
  # an internet-era compromise. On a LAN, more packets means the server sees your input
  # sooner, and 125 is the ceiling.
  - seta cl_maxpackets "125"
  # Interpolation nudge. Non-zero trades smoothness against a deliberate delay -- exactly
  # what we are removing. 0 on a LAN, always.
  - seta cl_timenudge "0"
  # Explicit rather than inherited: the base config's cl_maxpackets change makes this the
  # matching half.
  - seta cl_packetdup "0"

# ---------------------------------------------------------------------------------------
# XONOTIC -- engine and game data
# ---------------------------------------------------------------------------------------
# Set lanparty_game: xonotic (top of this file) to provision this instead of Quake III.
#
# WHY THIS GAME IS FETCHED AND QUAKE III IS NOT. Everything above about finding a copy of
# pak0.pk3, about rclone, about not committing game data, exists because Quake III's data
# is retail id Software property. Xonotic has no such problem: the DarkPlaces engine is
# GPL-2 and the art, maps, sounds and music are GPL / CC-BY-SA (Creative Commons
# Attribution-ShareAlike). Upstream publishes one zip containing engine and data for every
# platform, and a SHA-512 (Secure Hash Algorithm, 512-bit) beside it. So this role just
# downloads it -- no search, no rclone, no USB stick.
#
# IT IS STILL NOT COMMITTED. Not for licensing -- for size. The archive is 1.18 GB and
# GitHub rejects any file over 100 MB. .gitignore blocks it.
lanparty_xonotic_version: "0.8.6"

# Official mirror. dl.illwieckz.net and dl.unvanquished.net serve the identical file and
# are listed on xonotic.org/download as the alternatives if this one is slow.
lanparty_xonotic_url: "https://dl.xonotic.org/xonotic-{{ lanparty_xonotic_version }}.zip"

# PINNED, AND UNLIKE QUAKE III THIS ONE IS NOT OPTIONAL. There is exactly one official
# xonotic-0.8.6.zip, so a checksum here can only ever reject a corrupt or substituted
# download -- never a legitimately different copy, which is the reason
# lanparty_quake3_baseq3_sha256 is empty by default. Published at
# https://dl.xonotic.org/xonotic-0.8.6.sha512 and verified against the downloaded file.
#
# SHA-512, not SHA-256, because that is the digest upstream actually publishes for 0.8.6.
# Inventing a SHA-256 here would mean nobody could check it against anything.
lanparty_xonotic_sha512: >-
  cb39879e96f19abb2877588c2d50c5d3e64dd68153bec3dd1bebedf4d765e506afa419c28381d7005aed664cb1a042571c132b5b319e4308cab67745d996c2a6

# Skip the download by pointing at a zip you already have. Empty means "use .gamedata/,
# and fetch it there if it is missing".
lanparty_xonotic_src: ""

# WHERE IT LANDS, and why /opt rather than /usr/lib.
#
# Quake III goes under /usr/lib/quake3 because a Debian PACKAGE puts the engine there and
# two AppArmor profiles are written against that path. Xonotic is not packaged in Ubuntu at
# all -- there is no xonotic in main, universe or multiverse; `darkplaces` is the bare Quake
# engine with none of Xonotic's data. What upstream ships is a self-contained directory
# tree, and a self-contained add-on application tree is precisely what the FHS (Filesystem
# Hierarchy Standard) reserves /opt for. No AppArmor profile exists for it, so nothing
# constrains the choice the way it does for Quake III.
#
# Capital X because that is the directory name inside the archive. Renaming it would mean
# the tree on disk no longer matches what upstream's own scripts and documentation describe.
lanparty_xonotic_prefix: /opt/Xonotic

# Paths inside the archive NOT to unpack. Every one of these is for another operating
# system or another job, and none of it is reachable from anything this repo installs.
#
# This saves about 105 MB of disk on each machine and NOT ONE BYTE of transfer: Ansible
# pushes the whole zip and unzips it on the far end, so the exclusions apply after the copy.
# Worth doing anyway -- 105 MB of Windows binaries on a Linux box is 105 MB of things that
# should never be there.
#
# The seven .pk3 files under data/ are deliberately kept whole, including the 125 MB
# Nexuiz-compatibility set and the 110 MB music. Trimming those would mean the server can
# only ever run maps that survived the trim, and finding that out mid-party is worse than
# the disk.
lanparty_xonotic_exclude:
  # The macOS application bundle, including a whole embedded SDL2 framework. 27 MB.
  - "Xonotic/Xonotic.app/*"
  # Windows engine binaries, 32- and 64-bit, client and dedicated. 71 MB.
  - "Xonotic/*.exe"
  # The macOS dedicated server binary.
  - "Xonotic/xonotic-osx-dedicated"
  # Windows DLLs for those .exe files -- libcurl, libpng, libvorbis and friends, twice
  # over for 32- and 64-bit. 10 MB, and nothing on a Linux box can load them.
  - "Xonotic/bin32/*"
  - "Xonotic/bin64/*"
  # Mapping and packaging tools, plus an rsync auto-updater we specifically do not want
  # reaching out to the internet from a party machine.
  - "Xonotic/misc/*"
  # Build machinery. There is no compiler on a party laptop and no reason for one.
  - "Xonotic/Makefile"
  #
  # Xonotic/source/ IS NOT EXCLUDED, deliberately, though it is 28 MB and nothing here
  # reads it. The binaries this role copies onto other people's machines are GPL, and
  # source/ holds the corresponding source for them -- the DarkPlaces engine, the QuakeC
  # game code, gmqcc and d0_blind_id. Shipping the binary and dropping the source is
  # exactly the shape the licence exists to prevent, and 28 MB is not a reason to.

# ---------------------------------------------------------------------------------------
# XONOTIC -- dedicated server
# ---------------------------------------------------------------------------------------
lanparty_xonotic_hostname: "Office LAN Party"
# 26000 is the engine default, inherited from Quake -- DarkPlaces speaks a Quake-derived
# protocol. Distinct from Quake III's 27960, so both servers can run side by side.
lanparty_xonotic_port: 26000
# Player slots INCLUDING spectators, which is the one way this differs from Quake III's
# sv_maxclients.
lanparty_xonotic_maxplayers: 16

# Gametype identifier, not a number. dm deathmatch, tdm team deathmatch, ctf capture the
# flag, ca clan arena, ft freeze tag, lms last man standing, ka keepaway, ons onslaught,
# rc race, nb nexball, kh keyhunt, dom domination, as assault, inv invasion, cts complete
# the stage.
lanparty_xonotic_gametype: dm

# -1 in Xonotic means "use whatever the map says", which is why these are named _override:
# they replace the per-map value for every map and every gametype. Set either to -1 to hand
# the decision back to the map, or 0 for no limit at all.
lanparty_xonotic_fraglimit: 30
lanparty_xonotic_timelimit: 15

# Server frame INTERVAL in seconds, so smaller is faster -- the inverse of Quake III's
# sv_fps, and an easy thing to get backwards.
#
# Xonotic ships 0.0333333 (30 Hz), and its own xonotic-common.cfg says exactly why:
#
#     //sys_ticrate 0.0166667 // 60fps. This would be ideal, but kills home routers.
#     sys_ticrate 0.0333333   // Use 30fps instead.
#
# "Kills home routers" is a constraint about pushing 60 packets a second per player through
# consumer NAT (Network Address Translation) hardware over the internet. A LAN party has no
# router in the path at all -- one switch, one segment -- so the reason for the compromise
# is absent and we take the setting upstream calls ideal.
lanparty_xonotic_sys_ticrate: "0.0166667"

# Map rotation. Every name here is a real .bsp inside 0.8.6's maps pk3 -- CHECKED, because
# the example list in the shipped server/server.cfg still names `oilrig`, which was dropped
# from the game and would make the rotation skip an entry with no explanation.
#
# These six are the small-party deathmatch standards: two tight duel-ish arenas
# (stormkeep, silentsiege), two mid-size (solarium, afterslime), one open (xoylent) and one
# vertical (glowplant).
lanparty_xonotic_maps:
  - stormkeep
  - solarium
  - xoylent
  - afterslime
  - silentsiege
  - glowplant

# 0 plays lanparty_xonotic_maps in order; 1 picks at random. Order, so a party can be told
# what is coming next.
lanparty_xonotic_maplist_shuffle: 0

# Bots to fill empty slots so the server is worth joining before everyone arrives, and the
# skill they play at. `skill` defaults to 8 and lower is easier; 5 is a setting a mixed room
# can enjoy rather than be farmed by. Do not trust the engine's own description of this
# cvar -- it is inherited Quake text about monster difficulty and says nothing about
# Xonotic's bots.
lanparty_xonotic_minplayers: 4
lanparty_xonotic_bot_skill: 5

# Remote console password. Override on the command line for a real party:
#   ./bootstrap.sh -e lanparty_xonotic_rcon_password=something
# Never commit a real one -- this repo is public. Empty disables rcon entirely.
lanparty_xonotic_rcon_password: "changeme"

# System account the dedicated server runs as, and its userdir. The engine writes configs,
# logs and downloaded content under <userdir>/data/, which is the only path the systemd unit
# grants write access to.
lanparty_xonotic_server_user: xonotic-server
lanparty_xonotic_server_home: /var/games/xonotic-server

# Short command name symlinked to the launcher. Same reasoning as lanparty_quake3_alias
# above -- a symlink in /usr/local/bin, never a shell alias, because shell config on this
# workstation belongs to chezmoi. `x` rather than `q` so both games can be installed.
# Set to "" to skip it.
lanparty_xonotic_alias: x

# ---------------------------------------------------------------------------------------
# XONOTIC -- graphics
# ---------------------------------------------------------------------------------------
# Same policy as Quake III's, and it earns its keep more here. Xonotic is a 2023 renderer,
# not a 1999 one: a 4K panel really can drop it below its frame target, where Quake III
# would not notice. Capping at 1080p everywhere means every machine in the room gets the
# same picture at a frame rate that holds.
#
# Detection still runs, to CLAMP DOWN only -- a 1366x768 panel cannot display 1080p and
# asking for it fullscreen gets a black screen rather than a smaller picture. Set both to ""
# for per-machine native mode.
lanparty_xonotic_width: "1920"
lanparty_xonotic_height: "1080"

# Effects preset applied on top of everything below. Xonotic ships these as `exec`-able
# configs in its data pk3: omg, low, med, normal, high, ultra, ultimate. "normal" is the
# game's own default; "high" is the honest setting for any GPU made this decade.
# Set to "" to leave whatever the player already had.
lanparty_xonotic_effects_preset: high

# NOTE ON THE FIRST TWO. Both are already the engine's own defaults -- checked against
# `cvarlist`, not assumed -- and they are listed anyway because autoexec.cfg is re-read on
# every launch and config.cfg is not. A player who flips vsync on in the menu writes it to
# config.cfg; this puts it back next time the game starts. That is the whole point of the
# file, and a setting left out of it silently becomes per-machine.
lanparty_xonotic_gfx_cvars:
  # VSYNC OFF, for the same reason as Quake III: it costs up to a whole frame of input
  # latency to avoid tearing, and a deathmatch would rather have the frame.
  - seta vid_vsync "0"
  # Frame cap. Xonotic's physics are NOT frame-rate coupled the way Quake III's are, so
  # unlike com_maxfps 125 this is taste rather than muscle memory.
  - seta cl_maxfps "250"
  # Frame counter, top right. Default 0. At a party this is how an argument about whose
  # machine is struggling gets settled in two seconds.
  - seta showfps "1"

# ---------------------------------------------------------------------------------------
# XONOTIC -- client networking
# ---------------------------------------------------------------------------------------
# The counterpart to lanparty_quake3_lan_cvars: the handful of settings whose stock values
# assume an internet connection and cost something real on a switch. Set to [] to leave the
# engine's own defaults alone.
lanparty_xonotic_lan_cvars:
  # Bytes per second the client will accept from the server. The stock 40000 is sized for a
  # domestic uplink; the server's sv_maxrate already allows 1000000, so this is the client
  # half of a ceiling that a switch will never reach anyway.
  #
  # NO `seta`, AND THAT IS NOT A TYPO. `rate` is a COMMAND in this engine, not a cvar --
  # it writes the real setting into _cl_rate, which cvarlist describes as "internal storage
  # cvar for current rate (changed by rate command)". `seta rate 1000000` would silently
  # create a brand new cvar named rate, save it to config.cfg forever, and change nothing.
  - rate 1000000
  # Client-to-server input packets per second. Xonotic ships 60 with the note "should match
  # or be a multiple of sys_ticrate" -- which, with the 60 Hz tick set above, 60 already
  # does. 120 is the next legal step up and halves the age of the newest input the server
  # has when it runs a frame. Do NOT put an arbitrary number here: one that is not a
  # multiple of the tick makes the gap between a packet arriving and the frame that reads
  # it wander, which is worse than a slightly larger constant gap.
  - seta cl_netfps "120"
  # Repeat recent unacknowledged input in each packet, so a DROPPED packet does not lose a
  # keystroke. The default is 1. That is insurance against packet loss, and a wired switch
  # has none -- so on this network it is redundant payload and a small amount of extra work
  # per packet at both ends. Put it back to 1 if the party ends up on WiFi, where the
  # insurance is worth more than the bytes.
