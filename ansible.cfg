# Ansible control-node config for the LAN party fleet.
#
# WHAT THIS TREE IS. It provisions game machines for an office LAN party: one dedicated
# server, N player clients, every one of them reached at its address on the physical LAN.
# Deployment and gameplay use the SAME address -- inventory/hosts.yml templates
# `ansible_host` from `lan_ip`, so there is one address per machine and no second one to
# use by mistake.
#
# It did not always work this way: an earlier version deployed over a Tailscale tailnet and
# played over the LAN. That is two addresses per host which must never be interchanged, and
# the failure mode when they are is silent -- the party plays through a WireGuard tunnel,
# paying encryption and MTU (Maximum Transmission Unit) overhead on input packets, and
# Quake III's LAN server browser stops finding anything because broadcasts do not cross an
# overlay network at all. One address removes the whole class of mistake. What it costs:
# a machine that is not on this LAN cannot be provisioned, which at a party is not a cost.
#
# The LAN path is still checked rather than assumed -- see roles/lan_preflight and the
# net_ip setting in roles/quake3_server.
#
# THIS REPO IS LAYER 3. Two other Ansible trees already run on this workstation:
#
#   layer 1  a work provisioning repo   the dev machine itself
#   layer 2  a personal dotfiles/workstation repo
#
# They negotiated an isolation contract with each other, and a third tree that ignores it
# breaks both. The contract, and why each clause is load-bearing:
#
#   1. bootstrap.sh exports ANSIBLE_CONFIG to this file's absolute path. That is the
#      highest-precedence config source in Ansible, so nothing from another tree can leak
#      in -- and equally, this file is inert from any other directory. Neither of the
#      other two repos has a ~/.ansible.cfg, and we must not create one either: a user-
#      scope config would apply to all three.
#
#   2. collections_path below. Ansible's default is ~/.ansible/collections, which is
#      SHARED by every Ansible setup on the machine. It currently holds community.general
#      13.3.0 and ansible.posix 2.2.2, and BOTH other repos pin those exact versions on
#      purpose so the machine resolves one answer rather than two. A bare
#      `ansible-galaxy collection install` from here would upgrade them in place and
#      silently change what layers 1 and 2 execute. Ours stay in-tree and gitignored.
#
#   3. local_tmp below. Ansible's default is ~/.ansible/tmp, which galaxy also uses to
#      stage collection tarballs -- so without this, an install writes outside the tree
#      even though collections_path keeps the RESULT in-tree. With it, nothing outside
#      this directory is written at all, which is what makes test/container.sh's
#      "~/.ansible is byte-identical afterwards" claim exact rather than approximate.
#
#   4. ansible-core lives in .venv (see bootstrap.sh), built with stock `python3 -m venv`.
#      ~/.local/bin/ansible-playbook is a uv tool shim SHARED with both other repos and
#      pinned to 2.21.2. A `uv tool install --force ansible-core` at any other version
#      from here would hijack it for them. We never install or invoke a global ansible.
#
# The DEFAULT inventory is the party inventory rather than localhost, because unlike the
# other two trees this one is a fleet manager by design. The safety comes from the file
# itself being hand-maintained and committed, so what it targets is reviewable in git.
[defaults]
inventory = inventory/hosts.yml
local_tmp = .ansible-tmp
roles_path = roles
collections_path = .collections
retry_files_enabled = False
interpreter_python = auto_silent
# Party machines are provisioned once and then wiped/reimaged between events, so their
# host keys legitimately change. accept-new (in ssh_args) is the nuance we actually want;
# this setting stays False so a first contact never blocks on a prompt a playbook cannot
# answer.
host_key_checking = False
stdout_callback = default
callback_result_format = yaml
force_color = True

# Reached whenever the inventory names a remote host, i.e. every machine except this
# laptop. Ported from a configuration that has run against a real fleet.
[ssh_connection]
# One SSH round trip per task instead of several. With N machines being provisioned in
# parallel, per-task round trips are the dominant cost of a run.
pipelining = True
# ControlMaster/ControlPersist reuse ONE connection per host for the whole run.
# StrictHostKeyChecking=accept-new, not `no`: first contact with a new machine is
# accepted silently, but a CHANGED key on a machine already known still stops the run,
# which is the half worth keeping.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
